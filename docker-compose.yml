version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pismo_api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    hostname: otel-collector
    command: ["--config=env:OTEL_CONFIG"]
    environment:
      OTEL_CONFIG: |
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
        processors:
          batch:
        exporters:
          debug:
            verbosity: detailed
          prometheus:
            endpoint: 0.0.0.0:8889
          otlp/jaeger:
            endpoint: jaeger:4317
            tls:
              insecure: true
        service:
          pipelines:
            metrics:
              receivers: [otlp]
              processors: [batch]
              exporters: [prometheus, debug]
            traces:
              receivers: [otlp]
              processors: [batch]
              exporters: [otlp/jaeger, debug]
    ports:
      - "4317:4317"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v2.51.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "global:
          scrape_interval: 5s
        scrape_configs:
          - job_name: 'otel-collector'
            static_configs:
              - targets: ['otel-collector:8889']" > /tmp/prometheus.yml && \
        /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Interface Web
      - "4317"       # OTLP gRPC receptor interno
    depends_on:
      - otel-collector
  grafana:
    image: grafana/grafana:10.4.0
    container_name: pismo_grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/grafana/provisioning/datasources && \
        cat <<'EOF' > /etc/grafana/provisioning/datasources/datasources.yaml
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            access: proxy
            url: http://prometheus:9090
            isDefault: true
            jsonData:
              timeInterval: 5s
          - name: Jaeger
            type: jaeger
            access: proxy
            url: http://jaeger:16686
            uid: jaeger
            jsonData:
              tracesToMetrics:
                datasourceUid: 'Prometheus'
        EOF
        exec /run.sh
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger
  postgres:
    image: postgres:16-alpine
    container_name: pismo_postgres
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pismo -d pismo_db"]
      interval: 2s
      timeout: 3s
      retries: 10
    environment:
      - POSTGRES_USER=pismo
      - POSTGRES_PASSWORD=pismo_pass
      - POSTGRES_DB=pismo_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: pismo_cloudbeaver
    restart: always
    ports:
      - "8081:8978"
    volumes:
      - ./infra/cloudbeaver_config/initial-data-sources.conf:/opt/cloudbeaver/conf/initial-data-sources.conf:U,z
    depends_on:
      - postgres
    security_opt:
      - label=disable
  migrations:
    image: migrate/migrate:v4.17.0
    container_name: app_migrations
    volumes:
      - ./app/internal/infra/database/migrations:/migrations:z
    command:
      - -path=/migrations
      - -database=postgres://pismo:pismo_pass@postgres:5432/pismo_db?sslmode=disable
      - up
    depends_on:
      postgres:
        condition: service_healthy # <--- Espera o healthcheck do Postgres dar SUCESSO
    restart: "no"
    security_opt:
      - label=disable

volumes:
  postgres_data: