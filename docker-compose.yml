version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pismo_api
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_EXPORTER_OTLP_INSECURE=true
    depends_on:
      - otel-collector

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    hostname: otel-collector
    command: ["--config=env:OTEL_CONFIG"]
    environment:
      OTEL_CONFIG: |
        receivers:
          otlp:
            protocols:
              grpc:
                endpoint: 0.0.0.0:4317
        processors:
          batch:
        exporters:
          debug:
            verbosity: detailed
          prometheus:
            endpoint: 0.0.0.0:8889
          otlp/jaeger:
            endpoint: jaeger:4317
            tls:
              insecure: true
        service:
          pipelines:
            metrics:
              receivers: [otlp]
              processors: [batch]
              exporters: [prometheus, debug]
            traces:
              receivers: [otlp]
              processors: [batch]
              exporters: [otlp/jaeger, debug]
    ports:
      - "4317:4317"
      - "8889:8889"

  prometheus:
    image: prom/prometheus:v2.51.0
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "global:
          scrape_interval: 5s
        scrape_configs:
          - job_name: 'otel-collector'
            static_configs:
              - targets: ['otel-collector:8889']" > /tmp/prometheus.yml && \
        /bin/prometheus --config.file=/tmp/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - otel-collector
  jaeger:
    image: jaegertracing/all-in-one:latest
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Interface Web
      - "4317"       # OTLP gRPC receptor interno
    depends_on:
      - otel-collector